<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Hub</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#4f46e5,#06b6d4,#22c55e);
  min-height:100vh;
  color:#111827;
}

.app{
  width:100%;
  min-height:100vh;
  padding:24px 5%;
}

.hero{
  background:rgba(255,255,255,0.22);
  backdrop-filter:blur(18px);
  border-radius:30px;
  padding:26px 18px;
  text-align:center;
  color:white;
  box-shadow:0 18px 45px rgba(0,0,0,0.18);
}

.hero h1{
  margin:0;
  font-size:34px;
}

.hero p{
  margin:10px 0 0;
  font-size:15px;
  opacity:0.95;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:24px;
}

.card{
  border:0;
  border-radius:26px;
  padding:20px 12px;
  min-height:145px;
  background:white;
  box-shadow:0 12px 28px rgba(0,0,0,0.16);
  cursor:pointer;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.card:active{
  transform:scale(0.97);
}

.icon{
  font-size:42px;
  margin-bottom:12px;
}

.card h2{
  margin:0;
  font-size:18px;
}

.card p{
  margin:7px 0 0;
  font-size:12px;
  color:#6b7280;
  line-height:1.35;
}

.footer{
  margin-top:22px;
  text-align:center;
  color:white;
  font-size:13px;
  opacity:0.9;
}

@media(max-width:430px){
  .app{
    padding:20px 4%;
  }

  .hero h1{
    font-size:30px;
  }

  .grid{
    gap:13px;
  }

  .card{
    min-height:132px;
    border-radius:23px;
  }

  .icon{
    font-size:38px;
  }

  .card h2{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <h1>🎮 Games Hub</h1>
    <p>Choose a game category and start playing.</p>
  </div>

  <div class="grid">

    <button class="card" onclick="openPage('CODES/arcade.html')">
      <div class="icon">🕹️</div>
      <h2>Arcade Games</h2>
      <p>Snake, racing, flying, tapping games</p>
    </button>

    <button class="card" onclick="openPage('CODES/islamic.html')">
      <div class="icon">🕌</div>
      <h2>Islamic Games</h2>
      <p>Quiz, duas, Arabic letters, learning games</p>
    </button>

    <button class="card" onclick="openPage('CODES/brain.html')">
      <div class="icon">🧠</div>
      <h2>Brain Games</h2>
      <p>Memory, puzzle, number and thinking games</p>
    </button>

    <button class="card" onclick="openPage('CODES/kids.html')">
      <div class="icon">🌈</div>
      <h2>Kids Games</h2>
      <p>Colors, shapes, math and easy learning games</p>
    </button>

    <button class="card" onclick="openPage('CODES/other.html')">
      <div class="icon">🎲</div>
      <h2>Other Games</h2>
      <p>Dice, coin, challenge and fun mini games</p>
    </button>

  </div>

  <div class="footer">
    Games website by Farrukh
  </div>

</div>

<script>
function openPage(page){
  window.location.href = page;
}
</script>

</body>
</html>
