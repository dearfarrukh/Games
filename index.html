<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Hub</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial, sans-serif;
  color:white;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 20% 12%, rgba(255,255,255,0.18), transparent 18%),
    radial-gradient(circle at 80% 18%, rgba(255,214,10,0.22), transparent 22%),
    radial-gradient(circle at 50% 95%, rgba(6,182,212,0.25), transparent 30%),
    linear-gradient(135deg,#23002f,#4c1d95,#1d4ed8,#0891b2);
  background-attachment:fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
  background-size:38px 38px;
  opacity:0.45;
}

.app{
  width:100%;
  min-height:100vh;
  padding:22px 5% 26px;
  position:relative;
  z-index:1;
}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:34px;
  padding:40px 18px 28px;
  text-align:center;
  background:
    linear-gradient(135deg,rgba(255,255,255,0.24),rgba(255,255,255,0.08)),
    radial-gradient(circle at top left,rgba(255,255,255,0.35),transparent 34%),
    radial-gradient(circle at bottom right,rgba(255,214,10,0.22),transparent 35%);
  border:2px solid rgba(255,255,255,0.34);
  box-shadow:
    0 20px 45px rgba(0,0,0,0.28),
    inset 0 0 35px rgba(255,255,255,0.14);
  backdrop-filter:blur(18px);
}

.heroTopIcons{
  font-size:21px;
  letter-spacing:12px;
  opacity:0.8;
  margin-bottom:10px;
  white-space:nowrap;
}

.hero h1{
  margin:0;
  font-size:42px;
  line-height:1;
  text-shadow:0 6px 18px rgba(0,0,0,0.35);
}

.hero p{
  margin:12px auto 0;
  font-size:16px;
  opacity:0.95;
  max-width:340px;
  line-height:1.45;
}

.refreshBtn{
  position:absolute;
  top:14px;
  right:14px;
  border:0;
  border-radius:999px;
  width:42px;
  height:42px;
  background:linear-gradient(135deg,#ffffff,#dbeafe);
  color:#2563eb;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  z-index:5;
}

.refreshBtn:active{
  transform:scale(0.94);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:24px;
}

.card{
  position:relative;
  overflow:hidden;
  border:0;
  border-radius:30px;
  padding:18px 12px;
  min-height:160px;
  color:white;
  cursor:pointer;
  text-align:left;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  box-shadow:
    0 16px 30px rgba(0,0,0,0.28),
    inset 0 0 28px rgba(255,255,255,0.15);
  border:2px solid rgba(255,255,255,0.24);
}

.card::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle,rgba(255,255,255,0.30),transparent 30%);
  transform:translate(-18%,-18%);
  pointer-events:none;
}

.card::after{
  content:"PLAY";
  position:absolute;
  right:-8px;
  bottom:12px;
  font-size:30px;
  font-weight:900;
  opacity:0.16;
  transform:rotate(-12deg);
  pointer-events:none;
}

.card:active{
  transform:scale(0.97);
}

.cardContent{
  position:relative;
  z-index:2;
  width:100%;
}

.icon{
  width:58px;
  height:58px;
  border-radius:20px;
  background:rgba(255,255,255,0.23);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:inset 0 0 18px rgba(255,255,255,0.18);
  margin-bottom:13px;
}

.card h2{
  margin:0;
  font-size:18px;
  color:white;
  text-shadow:0 4px 12px rgba(0,0,0,0.45);
}

.card p{
  margin:7px 0 0;
  font-size:12px;
  color:rgba(255,255,255,0.92);
  line-height:1.35;
  text-shadow:0 2px 8px rgba(0,0,0,0.35);
}

.playPill{
  position:relative;
  z-index:2;
  margin-top:12px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.22);
  font-size:11px;
  font-weight:900;
  letter-spacing:0.6px;
}

.arcadeCard{
  background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);
}

.islamicCard{
  background:linear-gradient(135deg,#047857,#16a34a,#84cc16);
}

.brainCard{
  background:linear-gradient(135deg,#312e81,#9333ea,#ec4899);
}

.kidsCard{
  background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);
}

.otherCard{
  background:linear-gradient(135deg,#111827,#f97316,#facc15);
}

.footer{
  margin-top:22px;
  text-align:center;
  color:white;
  font-size:13px;
  opacity:0.95;
  background:rgba(0,0,0,0.18);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:18px;
  padding:12px;
}

@media(max-width:430px){
  .app{
    padding:18px 4% 24px;
  }

  .hero{
    padding:38px 16px 24px;
    border-radius:30px;
  }

  .heroTopIcons{
    font-size:18px;
    letter-spacing:8px;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:14px;
  }

  .refreshBtn{
    width:36px;
    height:36px;
    font-size:16px;
    top:12px;
    right:12px;
  }

  .grid{
    gap:13px;
  }

  .card{
    min-height:150px;
    border-radius:26px;
    padding:16px 11px;
  }

  .icon{
    width:52px;
    height:52px;
    border-radius:18px;
    font-size:30px;
  }

  .card h2{
    font-size:16px;
  }

  .card p{
    font-size:11px;
  }

  .playPill{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <button class="refreshBtn" onclick="hardRefreshApp()" title="Refresh App">
      🔄
    </button>

    <div class="heroTopIcons">
      🎯 🎲 🕹️ ⭐ 🚀 🎮
    </div>

    <h1>🎮 Games Hub</h1>
    <p>Choose a game category and start playing.</p>
  </div>

  <div class="grid">

    <button class="card arcadeCard" onclick="openPage('CODES/arcade.html')">
      <div class="cardContent">
        <div class="icon">🕹️</div>
        <h2>Arcade Games</h2>
        <p>Snake, racing, flying, tapping games</p>
      </div>
      <div class="playPill">START PLAYING →</div>
    </button>

    <button class="card islamicCard" onclick="openPage('CODES/islamic.html')">
      <div class="cardContent">
        <div class="icon">🕌</div>
        <h2>Islamic Games</h2>
        <p>Quiz, duas, Arabic letters, learning games</p>
      </div>
      <div class="playPill">START PLAYING →</div>
    </button>

    <button class="card brainCard" onclick="openPage('CODES/brain.html')">
      <div class="cardContent">
        <div class="icon">🧠</div>
        <h2>Brain Games</h2>
        <p>Memory, puzzle, number and thinking games</p>
      </div>
      <div class="playPill">START PLAYING →</div>
    </button>

    <button class="card kidsCard" onclick="openPage('CODES/kids.html')">
      <div class="cardContent">
        <div class="icon">🌈</div>
        <h2>Kids Games</h2>
        <p>Colors, shapes, math and easy learning games</p>
      </div>
      <div class="playPill">START PLAYING →</div>
    </button>

    <button class="card otherCard" onclick="openPage('CODES/other.html')">
      <div class="cardContent">
        <div class="icon">🎲</div>
        <h2>Other Games</h2>
        <p>Dice, coin, challenge and fun mini games</p>
      </div>
      <div class="playPill">START PLAYING →</div>
    </button>

  </div>

  <div class="footer">
    🎮 Games website by Farrukh
  </div>

</div>

<script>
function openPage(page){
  window.location.href = page;
}

/* =========================
   SAFE HARD REFRESH BUTTON
   This refreshes files but does not delete saved data.
========================= */
function hardRefreshApp(){
  const refreshUrl = window.location.pathname + "?refresh=" + Date.now();
  window.location.href = refreshUrl;
}
</script>

</body>
</html>
