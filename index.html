<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Games</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef1f7;color:#141824;overflow-x:hidden}
    body{padding-bottom:24px}
    .app{width:100%;min-height:100vh;padding:18px 5% 32px;background:linear-gradient(160deg,#f7f9ff 0%,#e9edf8 45%,#f3f0ff 100%)}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#5b7cfa,#9b5cf6,#ff7aaa);display:grid;place-items:center;color:white;font-size:27px;box-shadow:0 10px 25px rgba(85,95,180,.25)}
    .brand h1{margin:0;font-size:28px;line-height:1.05}.brand p{margin:4px 0 0;color:#667085;font-size:13px}.pill{border:0;border-radius:999px;padding:10px 14px;background:#fff;box-shadow:0 8px 18px rgba(35,45,85,.08);font-weight:800;color:#333}
    .hero{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:32px;padding:22px;margin-bottom:18px;box-shadow:0 18px 45px rgba(35,45,85,.10)}
    .hero h2{margin:0;font-size:24px}.hero p{color:#5c6678;margin:10px 0 0;line-height:1.45;font-size:15px}.search{margin-top:16px;width:100%;border:0;outline:0;border-radius:18px;background:#f1f3f8;padding:15px 16px;font-size:16px;user-select:text}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:0;text-align:left;border-radius:26px;background:#fff;padding:18px;box-shadow:0 10px 26px rgba(35,45,85,.09);min-height:126px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#141824}.card:active,.gameBtn:active,.action:active{transform:scale(.98)}
    .icon{font-size:34px}.card h3{margin:12px 0 4px;font-size:18px}.card p{margin:0;color:#667085;font-size:13px;line-height:1.35}.tag{display:inline-block;width:max-content;background:#eef2ff;color:#4254d9;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;margin-top:10px}
    .page{display:none}.page.active{display:block}.pageHead{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.back{border:0;background:#fff;border-radius:16px;width:46px;height:46px;font-size:22px;box-shadow:0 8px 18px rgba(35,45,85,.08)}.pageTitle{margin:0;font-size:25px}.gameList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.gameBtn{border:0;background:#fff;border-radius:24px;padding:16px;text-align:left;box-shadow:0 9px 22px rgba(35,45,85,.08);min-height:108px}.gameBtn strong{display:block;font-size:16px;margin-top:8px}.gameBtn span{font-size:12px;color:#667085;line-height:1.3}.gameArea{background:#fff;border-radius:28px;padding:18px;box-shadow:0 16px 38px rgba(35,45,85,.10);min-height:60vh}.gameTitle{margin:0 0 12px;font-size:23px}.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.score{background:#f2f4fa;border-radius:16px;padding:10px 13px;font-weight:900;margin:8px 0}.action{border:0;border-radius:16px;background:#141824;color:white;padding:12px 16px;font-weight:900;font-size:15px}.action.light{background:#eef1f7;color:#141824}.canvas{width:100%;max-width:430px;aspect-ratio:1/1;background:#111827;border-radius:22px;display:block;margin:12px auto;touch-action:none}.wideCanvas{aspect-ratio:1.35/1}.pad{display:grid;grid-template-columns:60px 60px 60px;gap:8px;justify-content:center;margin-top:10px}.pad button{height:48px;border:0;border-radius:15px;background:#eef1f7;font-size:22px;font-weight:900}.board3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:20px auto}.cell{height:92px;border:0;border-radius:20px;background:#eef1f7;font-size:38px;font-weight:1000}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:390px;margin:18px auto}.tile{height:78px;border:0;border-radius:18px;background:#eef1f7;font-size:28px;font-weight:1000}.matchGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:430px;margin:16px auto}.matchCard{height:74px;border:0;border-radius:18px;background:#5b7cfa;color:white;font-size:27px;font-weight:900}.question{font-size:20px;font-weight:900;text-align:center;margin:16px 0;line-height:1.35}.answers{display:grid;gap:10px}.answers button{border:0;border-radius:18px;background:#eef1f7;padding:15px;font-size:16px;font-weight:800;text-align:left}.bigCenter{text-align:center;font-size:56px;margin:20px 0}.input{width:100%;border:0;outline:0;background:#eef1f7;border-radius:16px;padding:14px;font-size:16px;user-select:text}.hidden{display:none!important}@media(max-width:430px){.app{padding:16px 4% 28px}.brand h1{font-size:24px}.grid,.gameList{gap:11px}.card{padding:15px;border-radius:23px}.gameBtn{padding:14px}.cell{height:82px}.tile{height:66px}.matchCard{height:66px}.hero{padding:18px;border-radius:28px}}
  </style>
</head>
<body>
<div class="app">
  <section id="homePage" class="page active">
    <div class="topbar"><div class="brand"><div class="logo">🎮</div><div><h1>Games</h1><p>All games in one file</p></div></div><button class="pill" onclick="location.reload()">Refresh</button></div>
    <div class="hero"><h2>Choose a folder</h2><p>Arcade, Islamic, Brain, Kids, Puzzle and Other games. Everything is inside this same <b>Games/index.html</b> file.</p><input id="searchBox" class="search" placeholder="Search game name..." oninput="searchGames(this.value)"></div>
    <div id="folderGrid" class="grid"></div>
    <div id="searchResults" class="gameList" style="margin-top:16px;display:none"></div>
  </section>
  <section id="categoryPage" class="page"><div class="pageHead"><button class="back" onclick="showHome()">‹</button><h2 id="categoryTitle" class="pageTitle"></h2></div><div id="categoryGames" class="gameList"></div></section>
  <section id="gamePage" class="page"><div class="pageHead"><button class="back" onclick="backToCategory()">‹</button><h2 id="gameHeader" class="pageTitle">Game</h2></div><div id="gameContent" class="gameArea"></div></section>
</div>
<script>
const folders=[
 {id:'arcade',name:'Arcade Games',icon:'🕹️',desc:'Fast action games',color:'#eef2ff'},
 {id:'islamic',name:'Islamic Games',icon:'🕌',desc:'Learning and quiz games',color:'#ecfdf3'},
 {id:'brain',name:'Brain Games',icon:'🧠',desc:'Memory and thinking',color:'#fff7ed'},
 {id:'kids',name:'Kids Games',icon:'🌈',desc:'Simple learning games',color:'#fdf2f8'},
 {id:'puzzle',name:'Puzzle Games',icon:'🧩',desc:'Logic and word games',color:'#f0f9ff'},
 {id:'other',name:'Other Games',icon:'🎲',desc:'Quick fun games',color:'#f5f3ff'}
];
const games=[
 {id:'snake',cat:'arcade',icon:'🐍',name:'Snake',desc:'Eat food and grow'}, {id:'pong',cat:'arcade',icon:'🏓',name:'Pong',desc:'Classic paddle game'}, {id:'breakout',cat:'arcade',icon:'🧱',name:'Breakout',desc:'Break the blocks'}, {id:'bird',cat:'arcade',icon:'🐦',name:'Flying Bird',desc:'Tap to fly'}, {id:'target',cat:'arcade',icon:'🎯',name:'Tap Target',desc:'Tap fast targets'},
 {id:'islamicQuiz',cat:'islamic',icon:'☪️',name:'Islamic Quiz',desc:'Basic Islamic questions'}, {id:'salahQuiz',cat:'islamic',icon:'🕌',name:'Salah Quiz',desc:'Prayer learning'}, {id:'prophetMatch',cat:'islamic',icon:'🌙',name:'Prophet Names Match',desc:'Memory matching'}, {id:'arabicMatch',cat:'islamic',icon:'ا',name:'Arabic Letter Match',desc:'Match letters'}, {id:'duaMatch',cat:'islamic',icon:'🤲',name:'Dua Word Match',desc:'Match dua words'},
 {id:'tic',cat:'brain',icon:'❌',name:'Tic Tac Toe',desc:'Two player game'}, {id:'memory',cat:'brain',icon:'🃏',name:'Memory Match',desc:'Find all pairs'}, {id:'simon',cat:'brain',icon:'🔴',name:'Simon Says',desc:'Repeat colors'}, {id:'reaction',cat:'brain',icon:'⚡',name:'Reaction Timer',desc:'Test your speed'}, {id:'cardGuess',cat:'brain',icon:'🂠',name:'Card Guess',desc:'Guess higher or lower'},
 {id:'colorMatch',cat:'kids',icon:'🎨',name:'Color Match',desc:'Pick matching color'}, {id:'shapeMatch',cat:'kids',icon:'🔷',name:'Shape Match',desc:'Pick matching shape'}, {id:'mathQuiz',cat:'kids',icon:'➕',name:'Math Quiz',desc:'Simple math'}, {id:'typing',cat:'kids',icon:'⌨️',name:'Typing Game',desc:'Type the word'}, {id:'wordScramble',cat:'kids',icon:'🔤',name:'Word Scramble',desc:'Fix the word'},
 {id:'numberPuzzle',cat:'puzzle',icon:'🔢',name:'Number Puzzle',desc:'Arrange numbers'}, {id:'wordPuzzle',cat:'puzzle',icon:'📝',name:'Word Puzzle',desc:'Guess letters'}, {id:'maze',cat:'puzzle',icon:'🌀',name:'Mini Maze',desc:'Reach the goal'},
 {id:'dice',cat:'other',icon:'🎲',name:'Dice Roll',desc:'Roll two dice'}, {id:'coin',cat:'other',icon:'🪙',name:'Coin Flip',desc:'Heads or tails'}, {id:'rps',cat:'other',icon:'✊',name:'Rock Paper Scissors',desc:'Beat computer'}, {id:'stopwatch',cat:'other',icon:'⏱️',name:'Stopwatch Challenge',desc:'Stop near 5 sec'}
];
let currentCategory='arcade',currentGame=null,gameTimer=null,extraTimer=null;
function clearTimers(){clearInterval(gameTimer);clearInterval(extraTimer);gameTimer=null;extraTimer=null;document.onkeydown=null;}
function page(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function showHome(){clearTimers();document.getElementById('searchBox').value='';document.getElementById('searchResults').style.display='none';document.getElementById('folderGrid').style.display='grid';page('homePage')}
function openCategory(id){clearTimers();currentCategory=id;const f=folders.find(x=>x.id===id);document.getElementById('categoryTitle').textContent=f.icon+' '+f.name;document.getElementById('categoryGames').innerHTML=games.filter(g=>g.cat===id).map(gameCard).join('');page('categoryPage')}
function backToCategory(){clearTimers();openCategory(currentCategory)}
function gameCard(g){return `<button class="gameBtn" onclick="openGame('${g.id}')"><div style="font-size:31px">${g.icon}</div><strong>${g.name}</strong><span>${g.desc}</span></button>`}
function loadHome(){document.getElementById('folderGrid').innerHTML=folders.map(f=>`<button class="card" onclick="openCategory('${f.id}')"><div><div class="icon">${f.icon}</div><h3>${f.name}</h3><p>${f.desc}</p></div><span class="tag">${games.filter(g=>g.cat===f.id).length} games</span></button>`).join('')}
function searchGames(q){q=q.toLowerCase().trim();const res=document.getElementById('searchResults');if(!q){res.style.display='none';document.getElementById('folderGrid').style.display='grid';return}document.getElementById('folderGrid').style.display='none';res.style.display='grid';res.innerHTML=games.filter(g=>g.name.toLowerCase().includes(q)).map(gameCard).join('')||'<p>No game found</p>'}
function openGame(id){clearTimers();currentGame=id;const g=games.find(x=>x.id===id);currentCategory=g.cat;document.getElementById('gameHeader').textContent=g.icon+' '+g.name;page('gamePage');const map={snake,pong,breakout,bird,target,islamicQuiz,salahQuiz,prophetMatch,arabicMatch,duaMatch,tic,memory,simon,reaction,cardGuess,colorMatch,shapeMatch,mathQuiz,typing,wordScramble,numberPuzzle,wordPuzzle,maze,dice,coin,rps,stopwatch};map[id]();}
function html(s){document.getElementById('gameContent').innerHTML=s}function rand(n){return Math.floor(Math.random()*n)}
function snake(){html(`<h3 class="gameTitle">Snake</h3><div class="row"><div id="score" class="score">Score: 0</div><button class="action" onclick="snake()">Restart</button></div><canvas id="c" class="canvas" width="400" height="400"></canvas><div class="pad"><span></span><button onclick="dir='up'">↑</button><span></span><button onclick="dir='left'">←</button><button onclick="dir='down'">↓</button><button onclick="dir='right'">→</button></div>`);let c=document.getElementById('c'),x=c.getContext('2d'),s=[{x:10,y:10}],food={x:15,y:15},dir='right',score=0,dead=false;document.onkeydown=e=>{if(e.key.includes('Up'))dir='up';if(e.key.includes('Down'))dir='down';if(e.key.includes('Left'))dir='left';if(e.key.includes('Right'))dir='right'};gameTimer=setInterval(()=>{if(dead)return;let h={...s[0]};if(dir==='right')h.x++;if(dir==='left')h.x--;if(dir==='up')h.y--;if(dir==='down')h.y++;if(h.x<0||h.y<0||h.x>19||h.y>19||s.some(p=>p.x===h.x&&p.y===h.y)){dead=true;alert('Game Over! Score: '+score);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:rand(20),y:rand(20)};document.getElementById('score').textContent='Score: '+score}else s.pop();x.fillStyle='#111827';x.fillRect(0,0,400,400);x.fillStyle='#22c55e';s.forEach(p=>x.fillRect(p.x*20+1,p.y*20+1,18,18));x.fillStyle='#ef4444';x.fillRect(food.x*20+1,food.y*20+1,18,18)},140)}
function pong(){html(`<h3 class="gameTitle">Pong</h3><div class="row"><div id="score" class="score">Score: 0</div><button class="action" onclick="pong()">Restart</button></div><canvas id="c" class="canvas wideCanvas" width="420" height="310"></canvas><div class="row"><button class="action light" onclick="py-=35">Up</button><button class="action light" onclick="py+=35">Down</button></div>`);let c=document.getElementById('c'),x=c.getContext('2d'),bx=210,by=155,vx=4,vy=3,py=120,score=0;document.onkeydown=e=>{if(e.key.includes('Up'))py-=35;if(e.key.includes('Down'))py+=35};gameTimer=setInterval(()=>{bx+=vx;by+=vy;if(by<8||by>302)vy*=-1;if(bx>410)vx*=-1;if(bx<25&&by>py&&by<py+70){vx*=-1;score++;document.getElementById('score').textContent='Score: '+score}if(bx<0){alert('Game Over! Score: '+score);pong()}x.fillStyle='#111827';x.fillRect(0,0,420,310);x.fillStyle='white';x.fillRect(12,py,12,70);x.beginPath();x.arc(bx,by,8,0,7);x.fill();},20)}
function breakout(){html(`<h3 class="gameTitle">Breakout</h3><div class="row"><div id="score" class="score">Blocks: 24</div><button class="action" onclick="breakout()">Restart</button></div><canvas id="c" class="canvas wideCanvas" width="420" height="310"></canvas><div class="row"><button class="action light" onclick="p-=35">Left</button><button class="action light" onclick="p+=35">Right</button></div>`);let c=document.getElementById('c'),x=c.getContext('2d'),bx=210,by=250,vx=3,vy=-3,p=170,blocks=[];for(let r=0;r<4;r++)for(let col=0;col<6;col++)blocks.push({x:col*68+12,y:r*28+20,w:56,h:18,on:1});document.onkeydown=e=>{if(e.key.includes('Left'))p-=35;if(e.key.includes('Right'))p+=35};gameTimer=setInterval(()=>{bx+=vx;by+=vy;if(bx<5||bx>415)vx*=-1;if(by<5)vy*=-1;if(by>300){alert('Game Over');breakout()}if(by>270&&bx>p&&bx<p+80)vy=-Math.abs(vy);blocks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+b.w&&by>b.y&&by<b.y+b.h){b.on=0;vy*=-1}});let left=blocks.filter(b=>b.on).length;document.getElementById('score').textContent='Blocks: '+left;if(left===0){alert('You Win!');breakout()}x.fillStyle='#111827';x.fillRect(0,0,420,310);x.fillStyle='white';x.fillRect(p,280,80,10);x.beginPath();x.arc(bx,by,7,0,7);x.fill();blocks.forEach(b=>{if(b.on)x.fillRect(b.x,b.y,b.w,b.h)})},18)}
function bird(){html(`<h3 class="gameTitle">Flying Bird</h3><div class="row"><div id="score" class="score">Score: 0</div><button class="action" onclick="bird()">Restart</button></div><canvas id="c" class="canvas wideCanvas" width="420" height="310"></canvas><button class="action" style="width:100%" onclick="v=-7">Tap / Fly</button>`);let c=document.getElementById('c'),x=c.getContext('2d'),y=150,v=0,pipe=420,gap=120,gy=90,score=0;c.onclick=()=>v=-7;gameTimer=setInterval(()=>{v+=.45;y+=v;pipe-=3;if(pipe<-50){pipe=420;gy=50+rand(130);score++;document.getElementById('score').textContent='Score: '+score}if(y<0||y>310||(pipe<80&&pipe>35&&(y<gy||y>gy+gap))){alert('Game Over! Score: '+score);bird()}x.fillStyle='#93c5fd';x.fillRect(0,0,420,310);x.fillStyle='#22c55e';x.fillRect(pipe,0,45,gy);x.fillRect(pipe,gy+gap,45,310);x.fillStyle='#facc15';x.beginPath();x.arc(60,y,14,0,7);x.fill()},25)}
function target(){html(`<h3 class="gameTitle">Tap Target</h3><div class="row"><div id="score" class="score">Score: 0</div><div id="time" class="score">Time: 20</div><button class="action" onclick="target()">Restart</button></div><div id="targetBox" style="height:420px;background:#eef1f7;border-radius:24px;position:relative;overflow:hidden"></div>`);let box=document.getElementById('targetBox'),score=0,time=20;function spawn(){box.innerHTML='';let b=document.createElement('button');b.textContent='🎯';b.style.cssText=`position:absolute;left:${rand(75)}%;top:${rand(82)}%;width:58px;height:58px;border:0;border-radius:50%;font-size:30px;background:white;box-shadow:0 8px 18px #0002`;b.onclick=()=>{score++;document.getElementById('score').textContent='Score: '+score;spawn()};box.appendChild(b)}spawn();gameTimer=setInterval(()=>{time--;document.getElementById('time').textContent='Time: '+time;if(time<=0){clearTimers();alert('Score: '+score)}},1000)}
function quiz(title,qs){let i=0,score=0;function draw(){let q=qs[i];html(`<h3 class="gameTitle">${title}</h3><div class="score">Score: ${score} / ${qs.length}</div><div class="question">${q.q}</div><div class="answers">${q.a.map((a,n)=>`<button onclick="answer(${n})">${a}</button>`).join('')}</div>`)}window.answer=n=>{if(n===qs[i].c)score++;i++;if(i>=qs.length){alert('Finished! Score: '+score+'/'+qs.length);openGame(currentGame)}else draw()};draw()}
function islamicQuiz(){quiz('Islamic Quiz',[{q:'How many daily prayers?',a:['3','5','7','10'],c:1},{q:'The Quran was revealed to?',a:['Musa AS','Isa AS','Muhammad ﷺ','Ibrahim AS'],c:2},{q:'First month of Islamic calendar?',a:['Ramadan','Muharram','Shawwal','Rajab'],c:1},{q:'Direction of prayer is called?',a:['Qibla','Adhan','Wudu','Salah'],c:0}])}
function salahQuiz(){quiz('Salah Quiz',[{q:'Which prayer is before sunrise?',a:['Fajr','Dhuhr','Isha'],c:0},{q:'Prayer after sunset?',a:['Asr','Maghrib','Fajr'],c:1},{q:'Wudu is for?',a:['Cleaning before prayer','Eating','Sleeping'],c:0},{q:'Jumuah is on?',a:['Monday','Friday','Sunday'],c:1}])}
function matchGame(title,items){let cards=[...items,...items].sort(()=>Math.random()-.5),open=[],done=0;html(`<h3 class="gameTitle">${title}</h3><div id="mg" class="matchGrid"></div>`);let mg=document.getElementById('mg');mg.innerHTML=cards.map((v,i)=>`<button class="matchCard" onclick="flip(${i})" id="m${i}" data-v="${v}">?</button>`).join('');window.flip=i=>{let b=document.getElementById('m'+i);if(b.disabled||open.includes(i))return;b.textContent=b.dataset.v;open.push(i);if(open.length===2){let a=document.getElementById('m'+open[0]),c=document.getElementById('m'+open[1]);if(a.dataset.v===c.dataset.v){a.disabled=c.disabled=true;done+=2;if(done===cards.length)setTimeout(()=>alert('You Win!'),200)}else setTimeout(()=>{a.textContent=c.textContent='?';},650);open=[]}}}
function prophetMatch(){matchGame('Prophet Names Match',['Adam','Nuh','Musa','Isa','Yusuf','Ibrahim','Yunus','Saleh'])}
function arabicMatch(){matchGame('Arabic Letter Match',['ا','ب','ت','ث','ج','ح','خ','د'])}
function duaMatch(){matchGame('Dua Word Match',['Allah','Rabbi','Ameen','Noor','Sabr','Shukr','Jannah','Rahmah'])}
function tic(){let b=Array(9).fill(''),turn='X';html(`<h3 class="gameTitle">Tic Tac Toe</h3><div id="status" class="score">Turn: X</div><div class="board3">${b.map((_,i)=>`<button class="cell" onclick="move(${i})" id="t${i}"></button>`).join('')}</div><button class="action" onclick="tic()">Restart</button>`);window.move=i=>{if(b[i])return;b[i]=turn;document.getElementById('t'+i).textContent=turn;let win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(w=>w.every(n=>b[n]===turn));if(win){alert(turn+' Wins!');tic();return}turn=turn==='X'?'O':'X';document.getElementById('status').textContent='Turn: '+turn}}
function memory(){matchGame('Memory Match',['🍎','🍌','🍇','🍒','🥝','🍉','🍍','🥥'])}
function simon(){let colors=['🔴','🔵','🟢','🟡'],seq=[],user=[];function next(){user=[];seq.push(rand(4));document.getElementById('level').textContent='Level: '+seq.length;flash()}function flash(){let i=0;extraTimer=setInterval(()=>{document.getElementById('show').textContent=colors[seq[i]];setTimeout(()=>document.getElementById('show').textContent='👀',350);i++;if(i>=seq.length)clearInterval(extraTimer)},700)}html(`<h3 class="gameTitle">Simon Says</h3><div id="level" class="score">Level: 0</div><div id="show" class="bigCenter">👀</div><div class="row">${colors.map((c,i)=>`<button class="action light" style="font-size:30px" onclick="pressSimon(${i})">${c}</button>`).join('')}</div><br><button class="action" onclick="simon()">Restart</button>`);window.pressSimon=i=>{user.push(i);if(user[user.length-1]!==seq[user.length-1]){alert('Wrong! Level '+seq.length);simon();return}if(user.length===seq.length)setTimeout(next,500)};next()}
function reaction(){html(`<h3 class="gameTitle">Reaction Timer</h3><p class="question" id="rt">Press start. Tap when screen says GO.</p><button id="rb" class="action" style="width:100%;height:180px;font-size:28px" onclick="startReact()">Start</button>`);let start=0,ready=false;window.startReact=()=>{let b=document.getElementById('rb');if(ready){alert('Reaction: '+(Date.now()-start)+' ms');reaction();return}b.textContent='Wait...';b.style.background='#ef4444';setTimeout(()=>{ready=true;start=Date.now();b.textContent='GO! TAP';b.style.background='#22c55e'},1000+rand(3000))}}
function cardGuess(){let cur=rand(13)+1,score=0;function draw(){html(`<h3 class="gameTitle">Card Guess</h3><div class="score">Score: ${score}</div><div class="bigCenter">${cur}</div><p class="question">Will next card be higher or lower?</p><div class="row"><button class="action" onclick="guessCard('h')">Higher</button><button class="action light" onclick="guessCard('l')">Lower</button></div>`)}window.guessCard=g=>{let n=rand(13)+1;if((g==='h'&&n>=cur)||(g==='l'&&n<=cur))score++;else{alert('Wrong! Score '+score);score=0}cur=n;draw()};draw()}
function colorMatch(){let colors=['Red','Blue','Green','Yellow','Purple'];let q=colors[rand(colors.length)];html(`<h3 class="gameTitle">Color Match</h3><div class="question">Pick: ${q}</div><div class="answers">${colors.sort(()=>Math.random()-.5).map(c=>`<button onclick="alert('${c===q?'Correct':'Try again'}');colorMatch()">${c}</button>`).join('')}</div>`)}
function shapeMatch(){let shapes=['● Circle','■ Square','▲ Triangle','◆ Diamond','★ Star'];let q=shapes[rand(shapes.length)];html(`<h3 class="gameTitle">Shape Match</h3><div class="question">Pick: ${q.split(' ')[1]}</div><div class="answers">${shapes.sort(()=>Math.random()-.5).map(c=>`<button onclick="alert('${c===q?'Correct':'Try again'}');shapeMatch()">${c}</button>`).join('')}</div>`)}
function mathQuiz(){let a=rand(10)+1,b=rand(10)+1,ans=a+b,opts=[ans,ans+1,ans-1,ans+2].sort(()=>Math.random()-.5);html(`<h3 class="gameTitle">Math Quiz</h3><div class="question">${a} + ${b} = ?</div><div class="answers">${opts.map(o=>`<button onclick="alert('${o===ans?'Correct':'Try again'}');mathQuiz()">${o}</button>`).join('')}</div>`)}
function typing(){let words=['apple','banana','quran','school','family','water','happy'],w=words[rand(words.length)],start=Date.now();html(`<h3 class="gameTitle">Typing Game</h3><div class="question">Type this word: <b>${w}</b></div><input id="typeIn" class="input" autofocus oninput="if(this.value==='${w}') {alert('Done in '+((Date.now()-${start})/1000).toFixed(1)+' sec'); typing()}">`)}
function wordScramble(){let words=['SNAKE','APPLE','WATER','PHONE','GAMES'],w=words[rand(words.length)],scr=w.split('').sort(()=>Math.random()-.5).join('');html(`<h3 class="gameTitle">Word Scramble</h3><div class="question">${scr}</div><input id="ws" class="input" placeholder="Type answer" oninput="if(this.value.toUpperCase()==='${w}') {alert('Correct'); wordScramble()}">`)}
function numberPuzzle(){let arr=[1,2,3,4,5,6,7,8,''].sort(()=>Math.random()-.5);function draw(){html(`<h3 class="gameTitle">Number Puzzle</h3><div class="tiles">${arr.map((v,i)=>`<button class="tile" onclick="slide(${i})">${v}</button>`).join('')}</div><button class="action" onclick="numberPuzzle()">Shuffle</button>`)}window.slide=i=>{let e=arr.indexOf(''),ok=[e-1,e+1,e-3,e+3].includes(i);if(ok){[arr[i],arr[e]]=[arr[e],arr[i]];draw();if(arr.join(',')==='1,2,3,4,5,6,7,8,')alert('You Win!')}};draw()}
function wordPuzzle(){let word='GAME',shown=Array(word.length).fill('_'),tries=6;html(`<h3 class="gameTitle">Word Puzzle</h3><div id="wp" class="bigCenter">${shown.join(' ')}</div><div id="tr" class="score">Tries: ${tries}</div><input class="input" maxlength="1" placeholder="Type a letter" oninput="guessLetter(this.value.toUpperCase());this.value=''">`);window.guessLetter=l=>{if(word.includes(l)){word.split('').forEach((ch,i)=>{if(ch===l)shown[i]=l})}else tries--;document.getElementById('wp').textContent=shown.join(' ');document.getElementById('tr').textContent='Tries: '+tries;if(!shown.includes('_'))alert('You Win!');if(tries<=0)alert('Answer: '+word)}}
function maze(){let p=0,goal=24,walls=[6,7,12,17,18];function draw(){html(`<h3 class="gameTitle">Mini Maze</h3><div class="tiles">${Array(25).fill(0).map((_,i)=>`<button class="tile" style="background:${walls.includes(i)?'#111827':i===goal?'#22c55e':'#eef1f7'}">${i===p?'🙂':i===goal?'🏁':walls.includes(i)?'':''}</button>`).join('')}</div><div class="pad"><span></span><button onclick="mv(-5)">↑</button><span></span><button onclick="mv(-1)">←</button><button onclick="mv(5)">↓</button><button onclick="mv(1)">→</button></div>`)}window.mv=d=>{let n=p+d;if(n<0||n>24||walls.includes(n)||(p%5===0&&d===-1)||(p%5===4&&d===1))return;p=n;if(p===goal)alert('You Win!');draw()};draw()}
function dice(){let a=rand(6)+1,b=rand(6)+1;html(`<h3 class="gameTitle">Dice Roll</h3><div class="bigCenter">🎲 ${a} + ${b}</div><button class="action" style="width:100%" onclick="dice()">Roll Again</button>`)}
function coin(){let r=Math.random()<.5?'Heads':'Tails';html(`<h3 class="gameTitle">Coin Flip</h3><div class="bigCenter">🪙</div><div class="question">${r}</div><button class="action" style="width:100%" onclick="coin()">Flip Again</button>`)}
function rps(){let opts=['Rock','Paper','Scissors'];window.playRps=u=>{let c=opts[rand(3)],win=(u==='Rock'&&c==='Scissors')||(u==='Paper'&&c==='Rock')||(u==='Scissors'&&c==='Paper');alert('Computer: '+c+'\n'+(u===c?'Tie':win?'You Win':'You Lose'));rps()};html(`<h3 class="gameTitle">Rock Paper Scissors</h3><div class="row"><button class="action" onclick="playRps('Rock')">✊ Rock</button><button class="action" onclick="playRps('Paper')">✋ Paper</button><button class="action" onclick="playRps('Scissors')">✌️ Scissors</button></div>`)}
function stopwatch(){let start=Date.now(),run=true;html(`<h3 class="gameTitle">Stopwatch Challenge</h3><p class="question">Stop as close as possible to 5.00 seconds.</p><div id="sw" class="bigCenter">0.00</div><button class="action" style="width:100%" onclick="run=false;alert('You stopped at '+document.getElementById('sw').textContent+' sec');stopwatch()">Stop</button>`);gameTimer=setInterval(()=>{if(run)document.getElementById('sw').textContent=((Date.now()-start)/1000).toFixed(2)},30)}
loadHome();
</script>
</body>
</html>
